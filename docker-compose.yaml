services:
  app:
    extends:
      file: docker/compose.yaml
      service: app
    build:
      context: .
      dockerfile: docker/development/Dockerfile
      args:
        USER_ID: ${WWW_USER:-$(id -u)}
        GROUP_ID: ${WWW_GROUP:-$(id -g)}
        PHP_VERSION: ${PHP_VERSION:-8.5}
        BASE_OS: ${BASE_OS:-alpine}
        BASE_VERSION: ${BASE_VERSION:-3.23}
    image: ghcr.io/feryardiant/learn-filament5:local
    ports:
      - ${APP_PORT:-8080}:8080
      - ${DEV_PORT:-5173}:5173
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      dev.orbstack.http-port: 8080
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2048M

  pgsql:
    extends:
      file: docker/compose.yaml
      service: pgsql

  mailpit:
    extends:
      file: docker/compose.yaml
      service: mailpit

networks:
  default:
    name: workorder-dev
    enable_ipv6: false

volumes:
  node-modules:
    driver: local
