#
# Development only — reverse-proxy the Vite dev server through this app's origin.
#
# The Vite dev server listens on plain HTTP (127.0.0.1:5173), while the app is
# served over HTTPS (e.g. through the OrbStack proxy). Loading dev assets
# directly from http://… on an HTTPS page is blocked by the browser as mixed
# content, so instead the browser loads them same-origin and nginx forwards
# them to Vite.
#
# `server.origin` in vite.config.ts points at the app origin so the generated
# dev asset URLs stay same-origin. Keep the locations below in sync with it.
#
# The numeric `40-` prefix is required: nginx evaluates regex locations in the
# order they are included, and the static-asset regexes in `performance.conf`
# / `security.conf` match `.css` / `.woff2`, which would otherwise shadow the
# proxy location below and return the app's 404.
#

# Vite module, CSS and static-file requests.
location ~ ^/(@vite|@id|@fs|@react-refresh|node_modules|resources)/ {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Vite HMR websocket (see `server.hmr.path` in vite.config.ts).
location = /vite-hmr {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
