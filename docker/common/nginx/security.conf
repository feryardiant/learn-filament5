#
# Security Headers
#
# NOTE: CORS is intentionally NOT handled here.
# - This app is served same-origin, so no CORS headers are needed for normal use.
# - A blanket "Access-Control-Allow-Origin: *" combined with
#   "Access-Control-Allow-Credentials: true" is rejected by browsers for any
#   credentialed cross-origin request, so it never actually enables CORS.
# If a cross-origin client is ever required, configure CORS explicitly at the
# application layer (e.g. config/cors.php) instead of globally in nginx.

# Prevent IFRAME spoofing attacks
add_header X-Frame-Options           "SAMEORIGIN" always;

# Prevent MIME attacks
add_header X-Content-Type-Options    "nosniff" always;

# Prevent Referrer URL from being leaked
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

# Configure Content Security Policy
# UPDATE - September 2020: Commenting this out until we grasp better security requirements
# add_header Content-Security-Policy   "default-src 'self' 'unsafe-inline'" always;

# Enable HSTS
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Prevent access to . files (the well-known directory)
location ~ /\.(?!well-known) {
    deny all;
}
