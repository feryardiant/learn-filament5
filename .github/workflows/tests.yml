name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prepare:
    name: Prepare
    uses: projek-xyz/actions/.github/workflows/prepare.yml@enhance-builds
    with:
      php-version: ${{ vars.PHP_VERSION || '8.5' }}

    permissions:
      contents: read
      pull-requests: write

  build:
    name: Build
    needs: [prepare]
    uses: projek-xyz/actions/.github/workflows/build.yml@enhance-builds
    with:
      target-env: staging
      branch: ${{ needs.prepare.outputs.target-branch }}
      composer-cache-dir: ${{ needs.prepare.outputs.composer-cache-dir }}
      node-pm-name: ${{ needs.prepare.outputs.node-pm-name }}
      node-pm-version: ${{ needs.prepare.outputs.node-pm-version }}
      build-path: |
        public/build
        public/css
        public/fonts
        public/js
        public/vendor

    permissions:
      contents: read

  unit:
    name: Unit
    runs-on: ubuntu-latest
    needs: [prepare]

    env:
      PHP_VERSION: ${{ vars.PHP_VERSION || '8.5' }}

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          runtime: 'node@lts'
          install: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: xdebug

      - name: Prepare Composer Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ needs.prepare.outputs.composer-cache-dir }}
          key: composer-php${{ env.PHP_VERSION }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-php${{ env.PHP_VERSION }}-composer-

      - name: Setup Application
        run: |
          composer install --prefer-dist --no-interaction --no-progress --ansi
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan migrate --force --ansi

      - name: Build Application
        run: |
          pnpm build

      - name: Run CI Checks
        run: |
          composer lint:check
          composer types:check
          php artisan test --ansi

  docker:
    name: Build Docker Images
    needs: [prepare, build]
    if: needs.prepare.outputs.should-build == '1'
    uses: projek-xyz/actions/.github/workflows/docker.yml@enhance-builds
    with:
      artifact-name: build-staging
      build-args: |
        BASE_OS=${{ vars.BASE_OS || 'alpine' }}
        BASE_VERSION=${{ vars.BASE_VERSION || '3.23' }}
        PHP_VERSION=${{ vars.PHP_VERSION || '8.5' }}
      docker-file: docker/staging/Dockerfile
      image-tag: ${{ needs.prepare.outputs.project-version }}
      image-slug: ${{ needs.prepare.outputs.branch-slug }}
      image-labels: |
        org.opencontainers.image.author=${{ github.repository_owner }}
        org.opencontainers.image.licenses=MIT

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
