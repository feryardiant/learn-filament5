name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    uses: projek-xyz/actions/.github/workflows/prepare.yml@882e6ca4458b1798de42e617c0f0a40eae09dea7
    with:
      php-version: ${{ vars.PHP_VERSION || '8.5' }}

    permissions:
      contents: read
      pull-requests: write

  unit:
    name: Unit
    if: needs.prepare.outputs.should-tests == '1'
    runs-on: ubuntu-latest
    needs: [prepare]

    env:
      PHP_VERSION: ${{ vars.PHP_VERSION || '8.5' }}
      DB_CONNECTION: pgsql
      DB_DATABASE: ${{ github.repository_owner }}
      DB_USERNAME: ${{ github.repository_owner }}
      DB_PASSWORD: secret

    permissions:
      contents: read

    services:
      pgsql:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.DB_DATABASE }}
          POSTGRES_USER: ${{ env.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          runtime: 'node@lts'
          install: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: xdebug

      - name: Prepare Composer Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ needs.prepare.outputs.composer-cache-dir }}
          key: composer-php${{ env.PHP_VERSION }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-php${{ env.PHP_VERSION }}-composer-

      - name: Setup Application
        run: |
          composer install --prefer-dist --no-interaction --no-progress --ansi
          cp .github/.env.example .env
          php artisan key:generate --ansi
          php artisan migrate --force --ansi

      - name: Build Application
        run: |
          pnpm build

      - name: Run CI Checks
        run: |
          composer lint:check
          composer types:check
          php artisan test --ansi
