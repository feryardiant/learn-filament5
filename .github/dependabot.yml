version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Jakarta
    versioning-strategy: increase-if-necessary
    groups:
      dependencies:
        dependency-type: production
        patterns: ['*']
      dev-dependencies:
        dependency-type: development
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Jakarta
    versioning-strategy: increase-if-necessary
    groups:
      dependencies:
        patterns: ['*']
